version: '3.9'
services:
  checkout_backend:
    build: .
    command: >
      sh -c "python manage.py wait_for_db && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - 8004:8000
    depends_on:
      - checkout_db
    networks:
      - checkout
      - users

  # checkout_queue:
  #   build: .
  #   command: >
  #     sh -c "python manage.py wait_for_db && python consumer.py"
  #   depends_on:
  #     - checkout_db
  #   networks:
  #     - checkout

  checkout_db:
    image: postgres
    environment:
      POSTGRES_DATABASE: checkout
      POSTGRES_ROOT_PASSWORD: root
    volumes:
      - postgres:/data/postgres
    restart: unless-stopped
    networks:
      - checkout

volumes:
  postgres:


networks:
  checkout:
  users:
    external:
      name: users
